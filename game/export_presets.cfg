html/head_include="<meta name=\"theme-color\" content=\"#0b1f17\">
<style>
#rotate-hint{display:none;position:fixed;inset:0;z-index:10;background:#0b1f17;color:#e8f5ee;font:600 20px/1.5 system-ui,sans-serif;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}
#rotate-hint b{font-size:56px;line-height:1.2}
@media (orientation:portrait) and (pointer:coarse){#rotate-hint{display:flex}}
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style>
<script>
(function(){
  // Full screen at the first tap or key (browsers allow it only then); on
  // phones again at every tap after the player leaves it, and turned sideways.
  var phone = matchMedia('(pointer:coarse)').matches, asked = false;
  function full() {
    if (document.fullscreenElement || document.webkitFullscreenElement || (asked && !phone)) return;
    asked = true;
    var d = document.documentElement, req = d.requestFullscreen || d.webkitRequestFullscreen;
    if (!req) return;
    var after = function() {
      if (phone && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){});
      // Esc pauses the game: the browser leaves full screen on a long press instead.
      if (!phone && navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock(['Escape']).catch(function(){});
    };
    var r = req.call(d, {navigationUI: 'hide'});
    if (r && r.then) r.then(after).catch(function(){}); else after();
  }
  addEventListener('pointerup', full, true);
  addEventListener('keydown', full, true);
  addEventListener('contextmenu', function(e){ e.preventDefault(); });
  addEventListener('DOMContentLoaded', function() {
    var h = document.createElement('div');
    h.id = 'rotate-hint';
    h.innerHTML = '<b>&#8635;</b>Telefonni gorizontal holatga o&#8216;giring<br><small>Поверните телефон горизонтально</small>';
    document.body.appendChild(h);
  });
})();
</script>"
