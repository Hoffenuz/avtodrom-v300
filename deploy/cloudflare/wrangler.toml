# The browser build at https://avtodrom.avtotestu.uz (Cloudflare Worker with
# static assets). Deploy with: py scripts/build.py --deploy-web
name = "avtodrom-web"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

routes = [{ pattern = "avtodrom.avtotestu.uz", custom_domain = true }]

[assets]
directory = "../../export/web-cf"
binding = "ASSETS"
run_worker_first = true
