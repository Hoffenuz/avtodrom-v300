# The browser build at https://avtodrom.avtotestu.uz (Cloudflare Worker with
# static assets). Published to github.com/avtodrom/avtodrom-web by
# `py scripts/build.py --publish-web`; Cloudflare Workers Builds deploys it.
name = "avtodrom-web"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

routes = [{ pattern = "avtodrom.avtotestu.uz", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
